name: kaamkaaz
description: Kaamkaaz - Where Works Finds You
publish_to: 'none'
version: 1.0.8+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.4
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.1
  http: ^1.6.0
  flutter_secure_storage: ^10.2.0
  geolocator: ^11.0.0
  google_fonts: ^6.1.0
  socket_io_client: ^2.0.3+1
  intl: any
  cached_network_image: ^3.3.1
  image_picker: ^1.2.2
  shimmer: ^3.0.0
  url_launcher: ^6.2.4
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  device_info_plus: ^13.1.0
  android_intent_plus: ^5.3.0
  share_plus: ^13.1.0
  fl_chart: ^1.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_local_notifications: ^21.0.0
  easy_localization: ^3.0.7
  logger: ^2.7.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  speech_to_text: ^7.4.0
  translator: ^1.0.4+1
  record: ^7.0.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  local_auth: ^3.0.1
  home_widget: ^0.9.2
  sqflite: ^2.4.2+1
  razorpay_flutter: ^1.3.7

  app_links: any
  path: any
  crypto: ^3.0.6
  flutter_tts: ^4.2.5
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  easy_localization_generator: ^0.3.5
  flutter_native_splash: ^2.4.1

  supabase: any
flutter_native_splash:
  color: "#000000"
  image: assets/images/kaamkaaz_splash_with_text.png  
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/images/kaamkaaz_splash_with_text.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#060E2A"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/images/icon.png
    - assets/languages/
    - assets/sounds/
